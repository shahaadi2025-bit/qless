services:
  # 1. QLESS Backend Service (Free Tier)
  - type: web
    name: qless-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: "*"

  # 2. QLESS Frontend Static Site (Free Global CDN)
  - type: web
    name: qless-frontend
    env: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
