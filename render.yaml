services:
  - type: web
    name: qless-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://shahaadi2025-bit.github.io
      - key: JWT_SECRET
        generateValue: true